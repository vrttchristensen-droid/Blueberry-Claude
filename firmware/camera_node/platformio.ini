; Camera node: Seeed XIAO ESP32-S3 Sense + OV3660 + microSD (32 GB, FAT32)
[env:xiao_esp32s3_sense]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi   ; 8 MB octal PSRAM on the Sense
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
